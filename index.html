<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер урока</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css">
    <link id="favicon" rel="icon" type="image/svg+xml" href="images/icon.png">
    <style>

            font-size: 1.1rem;

<body>
